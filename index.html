<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Proyek Pertama</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
            background: #f9f9f9;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Selamat Datang!</h1>
        <p>Website ini berhasil di-deploy menggunakan GitHub Pages.</p>
    </div>
</body>

</html>
